events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        set $pedidos http://pedidos:8001;
        set $recomendar http://recomendar:8002;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /pedidos {
            proxy_pass $pedidos/pedidos;
        }

        location = /sugerir {
            proxy_pass $recomendar/sugerir;
        }

        location = /salud/pedidos {
            proxy_pass $pedidos/salud;
        }

        location = /salud/recomendar {
            proxy_pass $recomendar/salud;
        }
    }
}