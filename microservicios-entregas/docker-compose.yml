services:
  recomendar:
    build: ./recomendar
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/salud', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
  pedidos:
    build: ./pedidos
    environment:
      RECOMENDAR_URL: http://recomendar:8002
    depends_on:
      recomendar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/salud', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  gateway:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
    depends_on:
      pedidos:
        condition: service_healthy
