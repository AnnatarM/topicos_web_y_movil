<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Seguimiento de Pedido</title>
</head>
<body>
    <h1>Seguimiento del Pedido #{{ folio }}</h1>

    <a href="{% url 'crear_pedido' %}">Crear otro pedido</a>
</body>
</html>
